# The whole platform: `docker compose up --build`, then open http://localhost:4200.
# Infrastructure only (for running the services from Maven and the frontend with npm start):
#   docker compose up -d postgres kafka kafka-init
# All passwords here are local demo values, not secrets.
name: claims-platform

# Shared by the three services: where to fetch auth-service's public keys, and the exact "iss" value the
# tokens carry. With a JWKS URL set, Spring only compares iss as a string; it never calls the issuer URL
# (which inside a container would point at the container itself).
x-jwt: &jwt
  AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  AUTH_JWT_ISSUER: http://localhost:8081

# Each service reports UP on /actuator/health once its database (and Flyway) are ready.
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 30s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: claims_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "5433:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent
      - pgdata:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims_platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"   # from the host: localhost:9092
    environment:
      # Single node acting as both broker and KRaft controller (no ZooKeeper)
      CLUSTER_ID: s8P27MCFJcW0NrpS0-Qx8Q   # any base64 UUID; fixed so the volume can be reused
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = other containers (kafka:29092), EXTERNAL = host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  # One-shot: creates the topics (auto-create is off), then exits.
  # claims.events.DLT = dead-letter topic for events reporting can't process (design section 7)
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in claims.events claims.events.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
    restart: "no"

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: *jwt
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/claims_platform
      # the RSA signing key, created on first start and kept on a volume so tokens survive a restart
      AUTH_JWT_KEY_PATH: /data/keys/auth-jwt-key.pem
      # registration checks the policy number with claims-service
      CLAIMS_SERVICE_URL: http://claims-service:8082
    ports:
      - "8081:8081"   # Swagger UI: http://localhost:8081/swagger-ui.html
    volumes:
      - authkeys:/data/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]

  claims-service:
    build:
      context: .
      dockerfile: services/claims-service/Dockerfile
    environment:
      <<: *jwt
      CLAIMS_DB_URL: jdbc:postgresql://postgres:5432/claims_platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCUMENTS_ROOT: /data/uploads
    ports:
      - "8082:8082"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting-service/Dockerfile
    environment:
      <<: *jwt
      REPORTING_DB_URL: jdbc:postgresql://postgres:5432/claims_platform
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]

  frontend:
    build: ./frontend
    ports:
      - "4200:80"     # the app: http://localhost:4200
    depends_on:
      auth-service:
        condition: service_healthy
      claims-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
  authkeys:
  uploads:
