# Serves the Angular app and forwards API calls by path prefix, exactly like proxy.conf.json in dev.
# Service names (auth-service, ...) are the docker compose service names.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are limited to 10 MB by claims-service, which answers bigger ones with a 413 ProblemDetail.
    # Let them through to it (nginx's own default would refuse anything over 1 MB with an HTML page).
    client_max_body_size 20m;

    location /api/auth/ {
        proxy_pass http://auth-service:8081;
    }

    location ~ ^/api/(claims|policies)(/|$) {
        proxy_pass http://claims-service:8082;
    }

    location ~ ^/api/(reports|notifications)(/|$) {
        proxy_pass http://reporting-service:8083;
    }

    # Built files have a content hash in their name, so they can be cached for good.
    location ~* \.(?:js|css|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/claims/123, /manager, ...) all load index.html; Angular's router takes over.
    # index.html itself is never cached, so a new build is picked up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
