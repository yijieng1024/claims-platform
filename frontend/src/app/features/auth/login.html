<div class="auth-page">
  <!-- the page's single hero panel: the only card with the large soft shadow (§5) -->
  <mat-card appearance="outlined" class="hero">
    <div class="hero-head">
      <app-logo [large]="true" />
      <h1>Log in</h1>
      <p class="muted">Track your claims and answer questions from your claims officer.</p>
    </div>

    @if (message()) {
      <p class="message" role="status">{{ message() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.errors?.['server']; as msg) { <mat-error>{{ msg }}</mat-error> }
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
        <!-- eye button: shows or hides the password; type="button" so it doesn't submit the form -->
        <button matIconButton matSuffix type="button" (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()">
          <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (form.controls.password.errors?.['server']; as msg) { <mat-error>{{ msg }}</mat-error> }
      </mat-form-field>
      <button matButton="filled" type="submit" class="full-width submit" [disabled]="form.invalid || busy()">Log in</button>
    </form>

    <p class="switch muted">New policyholder? <a routerLink="/register">Register</a></p>
  </mat-card>
</div>
