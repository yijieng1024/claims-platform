server:
  port: ${CLAIMS_PORT:8082}
  tomcat:
    # after a too-large upload is refused, read and discard up to this much of the rest of the body,
    # so the client receives the 413 instead of a reset connection (default 2MB is too little)
    max-swallow-size: 20MB

spring:
  application:
    name: claims-service
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:postgresql://localhost:5433/claims_platform}
    username: ${CLAIMS_DB_USER:claims_svc}
    password: ${CLAIMS_DB_PASSWORD:claims_svc}
    hikari:
      # unqualified SQL resolves to our schema whatever the DB user's search_path is
      schema: claims
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate.default_schema: claims
  flyway:
    schemas: claims
    default-schema: claims
  servlet:
    multipart:
      # documents (design section 9); too large -> 413 ProblemDetail via the shared advice
      max-file-size: 10MB
      max-request-size: 11MB   # the file plus the small informationRequestId field
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # key = claim id, value = the outbox JSON as stored (String serializers are Boot's default)
      acks: all
      properties:
        enable.idempotence: true
        # fail within seconds when Kafka is down, so one send never holds the outbox row locks for long
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          # keys are fetched on the first request that needs them, so startup doesn't need auth-service
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          # with jwk-set-uri set, this is only used to check the iss claim (no discovery call)
          issuer-uri: ${AUTH_JWT_ISSUER:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Outbox publisher (design section 7). Producer settings are under spring.kafka.
claims:
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
      interval-ms: 1000
      # longer than delivery.timeout.ms below, so Kafka's own error normally arrives first
      send-timeout: 15s
  # uploaded claim documents, {root}/{claimId}/{uuid}; ./data is git-ignored (design section 9)
  documents:
    root: ${DOCUMENTS_ROOT:./data/uploads}
