server:
  port: ${REPORTING_PORT:8083}

spring:
  application:
    name: reporting-service
  datasource:
    url: ${REPORTING_DB_URL:jdbc:postgresql://localhost:5433/claims_platform}
    username: ${REPORTING_DB_USER:reporting_svc}
    password: ${REPORTING_DB_PASSWORD:reporting_svc}
    hikari:
      # unqualified SQL resolves to our schema whatever the DB user's search_path is
      schema: reporting
  flyway:
    schemas: reporting
    default-schema: reporting
  jackson:
    deserialization:
      # events may carry fields this version doesn't know (e.g. outbox rows written with the older,
      # bigger snapshot); ignore them instead of failing (design section 7)
      fail-on-unknown-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reporting-service
      # a new consumer group reads claims.events from the start, so the read model can be rebuilt
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # commit each record's offset after the listener (and its DB transaction) returned
      ack-mode: record
    producer:
      # used only to move failed records to claims.events.DLT
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          # keys are fetched on the first request that needs them, so startup doesn't need auth-service
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          # with jwk-set-uri set, this is only used to check the iss claim (no discovery call)
          issuer-uri: ${AUTH_JWT_ISSUER:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
